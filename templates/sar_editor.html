<!DOCTYPE html>
<html lang="en">
{% include 'components/head.html' %}
<body class="m-0 p-0 font-sans bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    {% include 'components/header.html' %}

    <!-- Main Content -->
    <main class="flex flex-1 overflow-hidden relative">
        <!-- Left Panel (Input & Controls) -->
        <section class="w-[420px] flex-shrink-0 bg-white border-r border-slate-200 shadow-[2px_0_8px_-4px_rgba(0,0,0,0.1)] z-10 flex flex-col h-full overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 relative flex items-center justify-between">
                <h2 class="font-bold text-slate-700 text-sm tracking-wide flex items-center gap-2 uppercase">
                    FINAL VERDICT JSON
                </h2>
            </div>
            <div class="p-5 flex-1 flex flex-col gap-4 overflow-y-auto">
                <textarea id="verdict-input" class="w-full flex-1 p-3 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs text-slate-700 bg-slate-50 whitespace-pre shadow-inner resize-none" placeholder="JSON will appear here..."></textarea>
                <button id="generate-sar-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    GENERATE SAR DOCUMENT
                </button>
            </div>
        </section>

        <!-- Right Panel (The Record) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css" />
        <div id="right-panel-scroll" class="flex-1 bg-slate-100 overflow-y-auto h-full relative border-l border-slate-200">
            
            <div class="max-w-4xl w-full bg-white shadow-md mx-auto my-8 p-12 min-h-[1056px] rounded-sm">
                
                <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-6 sticky top-0 bg-white z-10">
                    <div class="flex space-x-4">
                        <button type="button" id="tab-preview" class="px-3 py-1.5 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors">
                            Preview Document
                        </button>
                        <button type="button" id="tab-code" class="px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors">
                            Edit Raw Markdown
                        </button>
                    </div>
                </div>

                <div id="view-preview" class="markdown-body w-full block text-slate-800">
                    <div class="text-slate-400 italic">Document content will appear here...</div>
                </div>

                <textarea id="view-code" class="w-full h-[800px] p-4 font-mono text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y hidden" spellcheck="false" placeholder="Raw markdown will appear here..."></textarea>
                
            </div>
        </div>
    </main>
    <script type="module">
        // 1. Import markdown-it and DOMPurify via bundled ES Modules
        import markdownit from 'https://esm.sh/markdown-it@14?bundle';
        import DOMPurify from 'https://esm.sh/dompurify@3?bundle';

        // 2. Initialize the parser with GitHub-like settings
        const md = markdownit({
            html: true,        // Enable HTML tags in source (Secured by DOMPurify below)
            linkify: true,     // Autoconvert URL-like text to links
            typographer: true, // Enable smartquotes and other typographic replacements
            breaks: true       // Convert '\n' in paragraphs into <br> (GitHub behavior)
        });

        // State Management
        let rawMarkdown = "";
        let isPreviewMode = true;

        // DOM Elements
        const tabPreview = document.getElementById('tab-preview');
        const tabCode = document.getElementById('tab-code');
        const viewPreview = document.getElementById('view-preview');
        const viewCode = document.getElementById('view-code');
        const generateBtn = document.getElementById('generate-sar-btn');

        // 3. Update the render function to Parse -> Sanitize -> Inject
        function render() {
            if (isPreviewMode) {
                // Parse the markdown, then rigorously sanitize it before injecting into the DOM
                const dirtyHtml = md.render(rawMarkdown);
                const cleanHtml = DOMPurify.sanitize(dirtyHtml);
                
                viewPreview.innerHTML = cleanHtml;
                
                viewPreview.classList.remove('hidden');
                viewCode.classList.add('hidden');
                
                tabPreview.className = "px-3 py-1.5 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors";
                tabCode.className = "px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors";
            } else {
                viewCode.value = rawMarkdown;
                viewCode.classList.remove('hidden');
                viewPreview.classList.add('hidden');
                
                tabCode.className = "px-3 py-1.5 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors";
                tabPreview.className = "px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors";
            }
        }

        // Tab Listeners
        tabPreview.addEventListener('click', () => {
            if (!isPreviewMode) {
                rawMarkdown = viewCode.value; // Capture edits before switching
            }
            isPreviewMode = true;
            render();
        });

        tabCode.addEventListener('click', () => {
            isPreviewMode = false;
            render();
        });

        // Handle manual typing in the raw editor
        viewCode.addEventListener('input', (e) => {
            rawMarkdown = e.target.value;
        });

        // Populate initial JSON from prior screen
        const verdictData = sessionStorage.getItem('sar_verdict');
        if (verdictData) {
            document.getElementById('verdict-input').value = JSON.stringify(JSON.parse(verdictData), null, 2);
        }

        // SSE Stream Logic
        generateBtn.addEventListener('click', () => {
            generateBtn.disabled = true;
            generateBtn.innerText = "Generating...";
            
            rawMarkdown = ""; // Reset
            render();
            
            const sse = new EventSource('/generate-sar-mock');

            sse.addEventListener('section_start', (e) => {
                let title = e.data;
                try { title = JSON.parse(e.data); } catch(err) {}
                rawMarkdown += `\n\n## ${title}\n\n`;
                render();
            });

            sse.addEventListener('token', (e) => {
                const parsed = JSON.parse(e.data);
                rawMarkdown += parsed.text;
                render();
                
                // Correctly target the specific scrollable container
                const scrollContainer = document.getElementById('right-panel-scroll');
                if (scrollContainer) {
                    scrollContainer.scrollTop = scrollContainer.scrollHeight;
                }
            });

            sse.addEventListener('section_done', (e) => {
                rawMarkdown += `\n\n`;
                render();
            });

            sse.addEventListener('complete', () => {
                sse.close();
                generateBtn.innerText = "Generation Complete";
                generateBtn.classList.replace("bg-blue-600", "bg-green-600");
                generateBtn.classList.replace("hover:bg-blue-700", "bg-green-600");
            });

            sse.onerror = () => {
                sse.close();
                generateBtn.innerText = "Error - Try Again";
                generateBtn.classList.replace("bg-blue-600", "bg-red-600");
                generateBtn.disabled = false;
            };
        });
    </script>
</body>
</html>
