<!DOCTYPE html>
<html lang="en">
{% include 'components/head.html' %}
<body class="m-0 p-0 font-sans bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    {% include 'components/header.html' %}

    <!-- Main Content -->
    <main class="flex flex-1 overflow-hidden relative">
        <!-- Left Panel (Input & Controls) -->
        <section class="w-[420px] flex-shrink-0 bg-white border-r border-slate-200 shadow-[2px_0_8px_-4px_rgba(0,0,0,0.1)] z-10 flex flex-col h-full overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 relative flex items-center justify-between">
                <h2 class="font-bold text-slate-700 text-sm tracking-wide flex items-center gap-2 uppercase">
                    FINAL VERDICT JSON
                </h2>
            </div>
            <div class="p-5 flex-1 flex flex-col gap-4 overflow-y-auto">
                <textarea id="verdict-input" class="w-full flex-1 p-3 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs text-slate-700 bg-slate-50 whitespace-pre shadow-inner resize-none" placeholder="JSON will appear here..."></textarea>
                <button id="generate-sar-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    GENERATE SAR DOCUMENT
                </button>
            </div>
        </section>

        <!-- Right Panel (The Record) -->
        <section class="flex-1 bg-slate-100 flex flex-col overflow-y-auto w-full">
            <div class="max-w-3xl w-full bg-white shadow-lg mx-auto mt-8 mb-8 p-12 min-h-[1056px] ring-1 ring-slate-200">
                <div id="editor-toolbar" class="flex items-center gap-2 border-b border-slate-200 pb-4 mb-4 sticky top-0 bg-white z-10">
                    <button type="button" id="btn-bold" class="p-2 text-slate-600 hover:bg-slate-100 rounded text-sm font-semibold transition-colors">B</button>
                    <button type="button" id="btn-italic" class="p-2 text-slate-600 hover:bg-slate-100 rounded text-sm font-semibold italic transition-colors">I</button>
                    <button type="button" id="btn-h1" class="p-2 text-slate-600 hover:bg-slate-100 rounded text-sm font-semibold transition-colors">H1</button>
                    <button type="button" id="btn-h2" class="p-2 text-slate-600 hover:bg-slate-100 rounded text-sm font-semibold transition-colors">H2</button>
                    <button type="button" id="btn-bullet" class="p-2 text-slate-600 hover:bg-slate-100 rounded text-sm font-semibold transition-colors">• List</button>
                </div>

                <div id="doc-content" class="focus:outline-none min-h-[800px] text-slate-800"></div>
            </div>
        </section>
    </main>

    <script type="module">
        // 1. Import pure Vanilla JS TipTap core and starter kit (without ?bundle to allow esm.sh deduplication of ProseMirror)
        import { Editor } from 'https://esm.sh/@tiptap/core@2';
        import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2';

        // 2. Initialize the editor on our div
        const editor = new Editor({
            element: document.querySelector('#doc-content'),
            extensions: [StarterKit],
            content: '',
            editorProps: {
                attributes: {
                    class: 'prose prose-sm max-w-none focus:outline-none min-h-[800px] whitespace-pre-wrap',
                },
            },
        });

        // 3. Wire up the toolbar buttons using Vanilla JS event listeners
        document.getElementById('btn-bold').addEventListener('click', (e) => { e.preventDefault(); editor.chain().focus().toggleBold().run(); });
        document.getElementById('btn-italic').addEventListener('click', (e) => { e.preventDefault(); editor.chain().focus().toggleItalic().run(); });
        document.getElementById('btn-h1').addEventListener('click', (e) => { e.preventDefault(); editor.chain().focus().toggleHeading({ level: 1 }).run(); });
        document.getElementById('btn-h2').addEventListener('click', (e) => { e.preventDefault(); editor.chain().focus().toggleHeading({ level: 2 }).run(); });
        document.getElementById('btn-bullet').addEventListener('click', (e) => { e.preventDefault(); editor.chain().focus().toggleBulletList().run(); });

        // 4. Handle initialization from sessionStorage
        const verdictData = sessionStorage.getItem('sar_verdict');
        if (verdictData) {
            document.getElementById('verdict-input').value = JSON.stringify(JSON.parse(verdictData), null, 2);
        }

        // 5. Integrate the SSE Generation Stream directly into TipTap
        const generateBtn = document.getElementById('generate-sar-btn');
        generateBtn.addEventListener('click', () => {
            generateBtn.disabled = true;
            generateBtn.innerText = "Generating...";
            
            // Clear editor before starting
            editor.commands.setContent('');
            
            const sse = new EventSource('/generate-sar-mock');

            sse.addEventListener('section_start', (e) => {
                editor.commands.insertContent(`<h2>${e.data}</h2><p></p>`);
            });

            sse.addEventListener('token', (e) => {
                const parsed = JSON.parse(e.data);
                editor.commands.insertContent(parsed.text);
                
                // Optional: Scroll to bottom of window as it types
                window.scrollTo(0, document.body.scrollHeight);
            });

            sse.addEventListener('section_done', (e) => {
                editor.commands.insertContent('<p></p><br>');
            });

            sse.addEventListener('complete', () => {
                sse.close();
                generateBtn.innerText = "Generation Complete";
            });

            sse.onerror = () => {
                sse.close();
                generateBtn.innerText = "Error - Try Again";
                generateBtn.disabled = false;
            };
        });
    </script>
</body>
</html>
