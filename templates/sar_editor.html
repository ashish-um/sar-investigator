<!DOCTYPE html>
<html lang="en">
{% include 'components/head.html' %}
<body class="m-0 p-0 font-sans bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    {% include 'components/header.html' %}

    <style>
        /* Hide the default markdown-it footnote block from the web view */
        .footnotes, .footnotes-sep {
            display: none !important;
        }
    </style>

    <!-- Main Content -->
    <main class="flex flex-1 overflow-hidden relative">
        <!-- Left Panel (Input & Controls) -->
        <section class="w-[420px] flex-shrink-0 bg-white border-r border-slate-200 shadow-[2px_0_8px_-4px_rgba(0,0,0,0.1)] z-10 flex flex-col h-full overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 relative flex items-center justify-between">
                <h2 class="font-bold text-slate-700 text-sm tracking-wide flex items-center gap-2 uppercase">
                    FINAL VERDICT JSON
                </h2>
            </div>
            <div class="p-5 flex-1 flex flex-col gap-4 overflow-y-auto">
                <textarea id="verdict-input" class="w-full flex-1 p-3 border border-slate-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-xs text-slate-700 bg-slate-50 whitespace-pre shadow-inner resize-none" placeholder="JSON will appear here..."></textarea>
                <button id="generate-sar-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    GENERATE SAR DOCUMENT
                </button>

                <!-- Agent Raw Reasoning (Debug) -->
                <details class="group bg-slate-50 border border-slate-200 rounded text-xs mt-2">
                    <summary class="font-semibold text-slate-600 p-3 cursor-pointer select-none hover:bg-slate-100 uppercase tracking-wide list-none flex justify-between items-center">
                        <span>Agent Raw Reasoning (Debug)</span>
                        <span class="text-xs transition-transform group-open:rotate-180">▼</span>
                    </summary>
                    
                    <div class="p-3 border-t border-slate-200 h-48 overflow-y-auto bg-slate-800 text-green-400 font-mono">
                        <pre id="debug-codes-stream" class="whitespace-pre-wrap break-words leading-tight">Awaiting stream...</pre>
                    </div>
                </details>
            </div>
        </section>

        <!-- Right Panel (The Record) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css" />
        <div id="right-panel-scroll" class="flex-1 bg-slate-100 overflow-y-auto h-full relative border-l border-slate-200">
            
            <div class="max-w-4xl w-full bg-white shadow-md mx-auto my-8 p-12 min-h-[1056px] rounded-sm">
                
                <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-6 sticky top-0 bg-white z-10">
                    <div class="flex space-x-4">
                        <button type="button" id="tab-preview" class="px-3 py-1.5 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors">
                            Preview Document
                        </button>
                        <button type="button" id="tab-code" class="px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors">
                            Edit Raw Markdown
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold text-purple-600 uppercase tracking-wider">Inspector Mode</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-inspector" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-600"></div>
                        </label>
                    </div>
                </div>

                <div id="view-preview" class="markdown-body w-full block text-slate-800">
                    <div class="text-slate-400 italic">Document content will appear here...</div>
                </div>

                <textarea id="view-code" class="w-full h-[800px] p-4 font-mono text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y hidden" spellcheck="false" placeholder="Raw markdown will appear here..."></textarea>
                
            </div>
        </div>
    </main>
    <script type="module">
        // 1. Import markdown-it and DOMPurify via bundled ES Modules
        import markdownit from 'https://esm.sh/markdown-it@14?bundle';
        import DOMPurify from 'https://esm.sh/dompurify@3?bundle';
        import markdownItFootnote from 'https://esm.sh/markdown-it-footnote@4?bundle';

        // 2. Initialize the parser with GitHub-like settings
        const md = markdownit({
            html: true,        // Enable HTML tags in source (Secured by DOMPurify below)
            linkify: true,     // Autoconvert URL-like text to links
            typographer: true, // Enable smartquotes and other typographic replacements
            breaks: true       // Convert '\n' in paragraphs into <br> (GitHub behavior)
        });
        md.use(markdownItFootnote);

        // State Management
        let rawMarkdown = "";
        let isPreviewMode = true;

        // DOM Elements
        const tabPreview = document.getElementById('tab-preview');
        const tabCode = document.getElementById('tab-code');
        const viewPreview = document.getElementById('view-preview');
        const viewCode = document.getElementById('view-code');
        const generateBtn = document.getElementById('generate-sar-btn');

        // 3. Update the render function to Parse -> Sanitize -> Inject
    // 1. Create reusable floating tooltip containers using Tailwind classes
    const tooltip = document.createElement('div');
    tooltip.className = 'absolute z-50 hidden max-w-sm p-4 text-sm text-slate-700 bg-white border border-slate-200 rounded-lg shadow-xl pointer-events-none transition-opacity duration-200 opacity-0';
    document.body.appendChild(tooltip);

    const reasoningTooltip = document.createElement('div');
    reasoningTooltip.className = 'absolute z-50 hidden w-72 p-3 text-xs text-left font-normal text-purple-900 bg-purple-50 border border-purple-200 rounded-lg shadow-xl pointer-events-none transition-opacity duration-200 opacity-0 transform -translate-x-1/2';
    document.body.appendChild(reasoningTooltip);

    // Global state for Inspector Mode
    let isInspectorMode = true;
    
    // Listen for toggle changes
    document.getElementById('toggle-inspector').addEventListener('change', (e) => {
        isInspectorMode = e.target.checked;
        render(); // Re-render the preview to show/hide the rationale
    });

    // 2. Updated Render Function
    function render() {
        if (isPreviewMode) {
            let processedMarkdown = rawMarkdown;

            // XAI Engine: Process [REASONING: ...] tags
            if (isInspectorMode) {
                const reasoningRegex = /\[REASONING:\s*(.*?)\]/g;
                processedMarkdown = processedMarkdown.replace(reasoningRegex, (match, rationale) => {
                    const cleanRationale = rationale.replace(/"/g, '&quot;');
                    return `<span class="reasoning-ref cursor-help inline-flex items-center justify-center ml-1 w-5 h-5 bg-purple-100 rounded-full hover:bg-purple-200 transition-colors" data-rationale="${cleanRationale}"><span class="text-xs text-purple-700">✨</span></span>`;
                });
            } else {
                processedMarkdown = processedMarkdown.replace(/\[REASONING:\s*(.*?)\]/g, '');
            }

            // Parse the processed markdown and sanitize
            const dirtyHtml = md.render(processedMarkdown);
            const cleanHtml = DOMPurify.sanitize(dirtyHtml, {
                ADD_TAGS: ['span', 'strong', 'div'],
                ADD_ATTR: ['class', 'data-rationale']
            });
            viewPreview.innerHTML = cleanHtml;
            
            // B. Attach Hover Logic to all footnote references
            const refs = viewPreview.querySelectorAll('.footnote-ref a');
            refs.forEach(ref => {
                const targetId = ref.getAttribute('href').substring(1); // e.g., "fn1"
                const footnoteLi = document.getElementById(targetId);
                
                if (footnoteLi) {
                    // Extract the text, but remove the "↩" return link since it's a popup
                    const content = footnoteLi.cloneNode(true);
                    const backref = content.querySelector('.footnote-backref');
                    if (backref) backref.remove();

                    // Show tooltip on hover
                    ref.addEventListener('mouseenter', (e) => {
                        tooltip.innerHTML = content.innerHTML;
                        tooltip.classList.remove('hidden');
                        
                        // Small timeout to trigger CSS fade-in
                        setTimeout(() => tooltip.classList.remove('opacity-0'), 10);
                        
                        // Position the tooltip directly below the superscript
                        const rect = ref.getBoundingClientRect();
                        tooltip.style.left = `${rect.left + window.scrollX}px`;
                        tooltip.style.top = `${rect.bottom + window.scrollY + 8}px`;
                    });

                    // Hide tooltip on mouse exit
                    ref.addEventListener('mouseleave', () => {
                        tooltip.classList.add('opacity-0');
                        setTimeout(() => tooltip.classList.add('hidden'), 200); // Wait for fade out
                    });
                }
            });

            // C. Attach Hover Logic to all reasoning references
            const reasoningRefs = viewPreview.querySelectorAll('.reasoning-ref');
            reasoningRefs.forEach(ref => {
                ref.addEventListener('mouseenter', (e) => {
                    const rationale = ref.getAttribute('data-rationale');
                    reasoningTooltip.innerHTML = `<strong class="block mb-1 text-purple-700 uppercase tracking-wider text-[10px]">AI Rationale</strong>${rationale}<div class="absolute top-full left-1/2 transform -translate-x-1/2 border-4 border-transparent border-t-purple-200"></div>`;
                    reasoningTooltip.classList.remove('hidden');
                    
                    const rect = ref.getBoundingClientRect();
                    reasoningTooltip.style.left = `${rect.left + window.scrollX + (rect.width / 2)}px`;
                    reasoningTooltip.style.top = `${rect.top + window.scrollY - reasoningTooltip.offsetHeight - 8}px`;
                    
                    setTimeout(() => reasoningTooltip.classList.remove('opacity-0'), 10);
                });

                ref.addEventListener('mouseleave', () => {
                    reasoningTooltip.classList.add('opacity-0');
                    setTimeout(() => reasoningTooltip.classList.add('hidden'), 200);
                });
            });

            // D. Update Tabs
            viewPreview.classList.remove('hidden');
            viewCode.classList.add('hidden');
            tabPreview.className = "px-3 py-1.5 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors";
            tabCode.className = "px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors";
        } else {
            viewCode.value = rawMarkdown;
            viewCode.classList.remove('hidden');
            viewPreview.classList.add('hidden');
            tabCode.className = "px-3 py-1.5 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors";
            tabPreview.className = "px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-700 border-b-2 border-transparent transition-colors";
        }
    }

        // Tab Listeners
        tabPreview.addEventListener('click', () => {
            if (!isPreviewMode) {
                rawMarkdown = viewCode.value; // Capture edits before switching
            }
            isPreviewMode = true;
            render();
        });

        tabCode.addEventListener('click', () => {
            isPreviewMode = false;
            render();
        });

        // Handle manual typing in the raw editor
        viewCode.addEventListener('input', (e) => {
            rawMarkdown = e.target.value;
        });

        // Populate initial JSON from prior screen
        const verdictData = sessionStorage.getItem('sar_verdict');
        if (verdictData) {
            document.getElementById('verdict-input').value = JSON.stringify(JSON.parse(verdictData), null, 2);
        }

        // SSE Stream Logic
        generateBtn.addEventListener('click', async () => {
            generateBtn.disabled = true;
            generateBtn.innerText = "Generating...";
            
            rawMarkdown = ""; // Reset
            render();
            
            const debugContainer = document.getElementById('debug-codes-stream');
            if (debugContainer) debugContainer.textContent = "Awaiting stream...";
            
            const verdictInput = document.getElementById('verdict-input').value;
            let verdict = {};
            if (verdictInput) {
                try {
                    verdict = JSON.parse(verdictInput);
                } catch (e) {
                    console.error("Invalid JSON verdict");
                }
            }

            try {
                const response = await fetch('/generate-sar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(verdict)
                });

                if (!response.body) throw new Error("No response body");
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const events = buffer.split('\n\n');
                    buffer = events.pop() || "";

                    for (const eventStr of events) {
                        if (!eventStr.trim()) continue;
                        
                        const lines = eventStr.split('\n');
                        let eventType = 'message';
                        let eventData = '';
                        
                        for (const line of lines) {
                            if (line.startsWith('event:')) {
                                eventType = line.substring(6).trim();
                            } else if (line.startsWith('data:')) {
                                eventData += line.substring(5).trim();
                            }
                        }

                        if (eventData) {
                            try {
                                const parsed = JSON.parse(eventData);
                                
                                if (eventType === 'section_start') {
                                    rawMarkdown += `\n\n## ${parsed}\n\n`;
                                    render();
                                } else if (eventType === 'token') {
                                    const tokenText = parsed.token || parsed.text || "";
                                    rawMarkdown += tokenText;
                                    render();
                                    
                                    const scrollContainer = document.getElementById('right-panel-scroll');
                                    if (scrollContainer) {
                                        scrollContainer.scrollTop = scrollContainer.scrollHeight;
                                    }
                                } else if (eventType === 'debug_token') {
                                    if (debugContainer) {
                                        if (debugContainer.textContent === "Awaiting stream...") {
                                            debugContainer.textContent = "";
                                        }
                                        debugContainer.textContent += parsed.token;
                                        debugContainer.parentElement.scrollTop = debugContainer.parentElement.scrollHeight;
                                    }
                                } else if (eventType === 'section_done') {
                                    rawMarkdown += `\n\n`;
                                    render();
                                } else if (eventType === 'section3_codes_identified') {
                                    console.log("Section 3 Codes Identified:", parsed);
                                } else if (eventType === 'section3_done') {
                                    console.log("Section 3 Done:", parsed);
                                    sessionStorage.setItem('section3_metadata', JSON.stringify({
                                        glossary_codes: parsed.glossary_codes,
                                        codes_string: parsed.codes_string
                                    }));
                                } else if (eventType === 'error') {
                                    console.error("SAR Generation Error:", parsed);
                                    generateBtn.innerText = "Error - Try Again";
                                    generateBtn.classList.replace("bg-blue-600", "bg-red-600");
                                    generateBtn.disabled = false;
                                } else if (eventType === 'complete') {
                                    generateBtn.innerText = "Generation Complete";
                                    generateBtn.classList.replace("bg-blue-600", "bg-green-600");
                                    generateBtn.classList.replace("hover:bg-blue-700", "bg-green-600");
                                }
                            } catch (err) {
                                console.error('Failed to parse SSE JSON data:', err, eventData);
                            }
                        }
                    }
                }
                
                // If stream finishes normally and wasn't marked complete by an event message
                if (generateBtn.innerText === "Generating...") {
                    generateBtn.innerText = "Generation Complete";
                    generateBtn.classList.replace("bg-blue-600", "bg-green-600");
                    generateBtn.classList.replace("hover:bg-blue-700", "bg-green-600");
                }
            } catch (error) {
                console.error("Stream error:", error);
                generateBtn.innerText = "Error - Try Again";
                generateBtn.classList.replace("bg-blue-600", "bg-red-600");
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
