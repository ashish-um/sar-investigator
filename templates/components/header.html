    <div class="flex items-center gap-6">

            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg> 
            <span>
                <span class="block">AML Investigator</span>
                <span class="block text-sm font-normal text-slate-500">made by kiran sheoran (8328)</span>
            </span>
        </h1>
        <div class="hidden sm:flex items-center gap-2 border-l border-slate-200 pl-6">
            <span class="text-[0.65rem] font-bold tracking-wider text-slate-400 uppercase">Provider</span>
            <span class="text-xs bg-slate-50 border border-slate-200 text-slate-600 px-2.5 py-1 rounded font-mono uppercase">{{ 'ChatGPT via Codex' if llm_config.provider == 'codex' else llm_config.provider }}</span>

    </div>
    <div class="flex items-center gap-4">
